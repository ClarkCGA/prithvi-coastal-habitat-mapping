model:
  name: "Prithvi_Global_aquaculture"
  n_channel: 6
  n_class: 4
  encoder_embed_dim: 1024
  dec_embed_dim: 512
  dropout_rate: 0.2
  arch: "prithvi"

device_name: "cuda"
#wandb_project: "Landsat-aquaculture-finetune-100prcnt-prithviGlobal"

n_iteration: 100

prithvi_model_new_weight: "/workspace/SamK/prithvi_v2/Prithvi_EO_V2_300M_TL.pt"

training:
  train_batch_size: 1
  learning_rate: 0.0001
  shuffle: True
  subset: 1

  optimizer:
    name: "AdamW"
    params:
      lr: 0.0001
       

  scheduler:
    name: "StepLR"
    params:
      step_size: 10
      gamma: 0.9


validation:
  val_batch_size: 2
  shuffle: False



data:
  #input: ['S1', 'S2']
  dataset_name: train_val
  n_frame: 1
  n_time_steps: 1
  data_dir: "/workspace/SamK/prithvi_v2/aquaculture_data"
  train_csv_path: /workspace/SamK/prithvi_v2/aquaculture_data/train_images.csv
  val_csv_path: /workspace/SamK/prithvi_v2/aquaculture_data/val_images.csv
  #train_dir_input: "/rhome/rghosal/crop/training_chips"
  #val_dir_input: "/rhome/rghosal/crop/validation_chips"
  #train_annot: "/rhome/rghosal/crop/training_data.txt"
  #val_annot: "/rhome/rghosal/crop/validation_data.txt"
  apply_normalization: True
  global_stats:
    mean: [0.120230265, 0.10370902, 0.08467793, 0.19951299, 0.109360956, 0.060086336]
    std: [0.01318866, 0.016127938, 0.021753421, 0.07539786, 0.054378532, 0.035520297]
  
  input_size: [1, 224, 224]
  patch_size: [1, 16, 16]
  transformations:
  - v_flip
  - h_flip
  - d_flip
  - rotate
  #target_norm: "none"
  #input_norm: "zscore"
  
Loss: "CrossEntropyLoss"
class_weights:  [
    0.1295236564566017, 
    0.28468693695264996, 
    0.29059512003264765,
    0.2951942865581007
  ]

ignore_index: -1

output_dir: "/workspace/SamK/prithvi_v2/results/"

logging:
checkpoint_dir: "/workspace/SamK/prithvi_v2/checkpoint_aqa100_p.pth" 

#segment_input_path: "/rhome/rghosal/crop/validation_chips/chip_304_542_merged.tif"
#predicted_mask_dir: "./segment_out_prithvi_crop"